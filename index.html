<style>

  .btn-sec { padding: 8px 11px; border-radius: 12px; border: none; background: #1e293b; color: #e2e8f0; font-size: 13px;

<body>
<div class="wrap">
  <header>
    <div class="logo" id="logo">🚴</div>
    <div>
      <h1>ReRide <span class="ver">v1.7</span> <span class="ver" id="mode-badge">🚴 Bike</span></h1>
      <p class="sub" id="sub">Reale Touren und Läufe visuell nachfahren – installierbare Web-App</p>
    </div>
  </header>

  <nav>
    <button data-tab="import" class="active">📥 Import</button>
    <button data-tab="analyse">📈 Analyse</button>
    <button data-tab="match">🎯 Match</button>
    <button data-tab="relive">🎥 ReRide</button>
    <button data-tab="setup">⚙️ Setup</button>
  </nav>

  <section id="tab-import"></section>
  <section id="tab-analyse" hidden></section>
  <section id="tab-match" hidden></section>
  <section id="tab-relive" hidden></section>
  <section id="tab-setup" hidden></section>
</div>
<div id="dim"></div>

<script>
"use strict";
window.onerror = function (msg, src, line) {
  try {
    var d = document.getElementById("err-banner");
    if (!d) {
      d = document.createElement("div");
      d.id = "err-banner";
      d.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fecaca;padding:10px;font:12px/1.4 monospace;white-space:pre-wrap";
      document.body.appendChild(d);
    }
    d.textContent = "ReRide-Fehler: " + msg + " (Zeile " + line + ")";
  } catch (e) {}
  return false;
};
// ---------- Utils ----------
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (v, d) => Number(v).toFixed(d || 1);

function haversineKm(a, b) {
  const R = 6371, rad = (x) => (x * Math.PI) / 180;
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function bearingOf(a, b) {
  const rad = (x) => (x * Math.PI) / 180;
  const y = Math.sin(rad(b.lon - a.lon)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lon - a.lon));
  return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
}

// ---------- Modus (Bike / Run) ----------
var mode = "bike";
try { mode = localStorage.getItem("r2z_mode") === "run" ? "run" : "bike"; } catch (e) {}
function realSecFor(distKm) { return Math.max(60, (distKm / (mode === "run" ? 10 : 25)) * 3600); }
function applyMode() {
  const lg = $("logo"); if (lg) lg.textContent = mode === "run" ? "🏃" : "🚴";
  const mb = $("mode-badge"); if (mb) mb.textContent = mode === "run" ? "🏃 Run" : "🚴 Bike";
  try { localStorage.setItem("r2z_mode", mode); } catch (e) {}
}

// ---------- Parsing (GPX/TCX, tolerant per Regex) ----------
function extractGpxPoints(text) {
  const pts = [];
  const re = /<(?:[a-zA-Z0-9]+:)?trkpt\b([^>]*)>([\s\S]*?)<\/(?:[a-zA-Z0-9]+:)?trkpt>/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const lat = m[1].match(/lat="(-?[\d.]+)"/), lon = m[1].match(/lon="(-?[\d.]+)"/);
    if (!lat || !lon) continue;
    const ele = m[2].match(/<ele>\s*(-?[\d.]+)\s*<\/ele>/);
    pts.push({ lat: parseFloat(lat[1]), lon: parseFloat(lon[1]), ele: ele ? parseFloat(ele[1]) : 0 });
  }
  return pts;
}
function extractTcxPoints(text) {
  const pts = [];
  const re = /<Trackpoint>([\s\S]*?)<\/Trackpoint>/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const lat = m[1].match(/<LatitudeDegrees>\s*(-?[\d.]+)\s*<\/LatitudeDegrees>/);
    const lon = m[1].match(/<LongitudeDegrees>\s*(-?[\d.]+)\s*<\/LongitudeDegrees>/);
    if (!lat || !lon) continue;
    const ele = m[1].match(/<AltitudeMeters>\s*(-?[\d.]+)\s*<\/AltitudeMeters>/);
    pts.push({ lat: parseFloat(lat[1]), lon: parseFloat(lon[1]), ele: ele ? parseFloat(ele[1]) : 0 });
  }
  return pts;
}
function parseActivity(text, fallbackName) {
  let pts = extractGpxPoints(text), source = "GPX-Import";
  if (pts.length < 2) { pts = extractTcxPoints(text); source = "TCX-Import"; }
  if (pts.length < 2) return null;
  const nameM = text.match(/<name>([^<]{1,80})<\/name>/);
  return buildRide(nameM ? nameM[1].trim() : fallbackName, pts, source);
}
function buildRide(name, raw, source) {
  const pts = raw.filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lon));
  if (pts.length < 2) return null;
  let dist = 0, gain = 0, prevEle = pts[0].ele;
  const profile = [{ km: 0, ele: Math.round(pts[0].ele) }];
  const step = Math.max(1, Math.floor(pts.length / 90));
  for (let i = 1; i < pts.length; i++) {
    dist += haversineKm(pts[i - 1], pts[i]);
    const d = pts[i].ele - prevEle;
    if (d > 0.5) gain += d;
    prevEle = pts[i].ele;
    if (i % step === 0 || i === pts.length - 1) profile.push({ km: Math.round(dist * 100) / 100, ele: Math.round(pts[i].ele) });
  }
  const mapStep = Math.max(1, Math.ceil(pts.length / 1500));
  const points = pts.filter((_, i) => i % mapStep === 0 || i === pts.length - 1);
  const stops = [0];
  let acc = 0;
  for (let i = 1; i < points.length; i++) {
    acc += haversineKm(points[i - 1], points[i]);
    if (acc >= 0.05) { stops.push(i); acc = 0; }
  }
  if (stops[stops.length - 1] !== points.length - 1) stops.push(points.length - 1);
  const realSec = realSecFor(dist);
  return { name, distanceKm: dist, elevationM: Math.round(gain), points, profile, source, stops, realSec };
}

// ---------- Demo-Runden ----------
function makeDemoRide(name, km, hm, seed) {
  const n = Math.min(600, Math.max(120, Math.round(km * 8)));
  const lat0 = 49.75 + (seed % 5) * 0.35, lon0 = 8.65 + (seed % 3) * 0.4;
  const aDeg = km / (2 * Math.PI) / 111, cycles = Math.max(2, Math.round(hm / 220));
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = (i / n) * Math.PI * 2, wob = 1 + 0.25 * Math.sin(t * 3 + seed);
    pts.push({
      lat: lat0 + aDeg * wob * Math.sin(t),
      lon: lon0 + ((aDeg / Math.cos((lat0 * Math.PI) / 180)) * wob * Math.cos(t) * 0.8),
      ele: 120 + (hm / cycles / 2) * (1 - Math.cos(t * cycles)) + 25 * Math.sin(t * 2 + seed)
    });
  }
  return buildRide(name, pts, "Demo");
}
const DEMOS = [
  makeDemoRide("Feierabendrunde", 14, 90, 1),
  makeDemoRide("Heimatrunde Odenwald", 42, 640, 3),
  makeDemoRide("Bodensee-Rundfahrt", 62, 380, 5)
];

// ---------- Zwift-Match ----------
const ZWIFT_ROUTES = [
  { name: "Watopia Flat Route", world: "Watopia", kind: "Flach", distanceKm: 10.0, elevationM: 35 },
  { name: "Crit City Downtown", world: "Crit City", kind: "Flach", distanceKm: 5.0, elevationM: 10 },
  { name: "Greater London Loop", world: "London", kind: "Hügelig", distanceKm: 15.2, elevationM: 145 },
  { name: "Watopia Hilly Loop", world: "Watopia", kind: "Hügelig", distanceKm: 15.2, elevationM: 155 },
  { name: "Richmond UCI Worlds Loop", world: "Richmond", kind: "Hügelig", distanceKm: 16.5, elevationM: 230 },
  { name: "New York KOM Loop", world: "New York", kind: "Berg", distanceKm: 12.0, elevationM: 380 },
  { name: "Epic KOM Loop", world: "Watopia", kind: "Berg", distanceKm: 14.1, elevationM: 420 },
  { name: "Alpe du Zwift", world: "Watopia", kind: "Berg", distanceKm: 12.2, elevationM: 1030 }
];
function matchScore(r, z) {
  const dP = Math.abs(z.distanceKm - r.distanceKm) / Math.max(r.distanceKm, 1);
  const eP = Math.abs(z.elevationM - r.elevationM) / Math.max(r.elevationM, 100);
  return Math.round((1 - Math.min(1, 0.6 * dP + 0.4 * eP)) * 100);
}
function estimateTime(km, hm) {
  const h = Math.floor(km / 26 + hm / 550);
  const m = Math.round(((km / 26 + hm / 550) - h) * 60);
  return h > 0 ? h + " h " + m + " min" : m + " min";
}

// ---------- SVG-Bausteine ----------
function routeMapSvg(points, progress) {
  if (points.length < 2) return "";
  const lats = points.map((p) => p.lat), lons = points.map((p) => p.lon);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const w = 320, h = 190, pad = 14;
  const sx = (lon) => pad + ((lon - minLon) / ((maxLon - minLon) || 1)) * (w - 2 * pad);
  const sy = (lat) => h - pad - ((lat - minLat) / ((maxLat - minLat) || 1)) * (h - 2 * pad);
  const toPath = (arr) => arr.map((p, i) => (i ? "L" : "M") + sx(p.lon).toFixed(1) + "," + sy(p.lat).toFixed(1)).join(" ");
  const base = toPath(points);
  let grid = "";
  [38, 76, 114, 152].forEach((y) => { grid += `<line x1="10" y1="${y}" x2="310" y2="${y}" stroke="#1e293b"/>`; });
  [64, 128, 192, 256].forEach((x) => { grid += `<line x1="${x}" y1="10" x2="${x}" y2="180" stroke="#1e293b"/>`; });
  let extra = "";
  if (progress != null) {
    const idx = clamp(Math.round(progress * (points.length - 1)) + 1, 1, points.length);
    const head = points.slice(0, idx), m = head[head.length - 1];
    const mx = sx(m.lon).toFixed(1), my = sy(m.lat).toFixed(1);
    extra = `<path d="${toPath(head)}" fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="${mx}" cy="${my}" r="5" fill="#fff" stroke="#f97316" stroke-width="2.5"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" class="svg-full">
    <rect x="0" y="0" width="${w}" height="${h}" rx="12" fill="#0f172a"/>${grid}
    <path d="${base}" fill="none" stroke="#f97316" stroke-opacity="0.25" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="${base}" fill="none" stroke="#f97316" stroke-opacity="${progress != null ? 0.35 : 1}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${extra}</svg>`;
}
function profileSvg(profile) {
  const w = 320, h = 150, pad = 10;
  const eles = profile.map((p) => p.ele);
  const minE = Math.min(...eles), maxE = Math.max(...eles);
  const maxKm = profile[profile.length - 1].km || 1;
  const x = (km) => pad + (km / maxKm) * (w - 2 * pad);
  const y = (ele) => h - pad - ((ele - minE) / ((maxE - minE) || 1)) * (h - 2 * pad);
  const d = profile.map((p, i) => (i ? "L" : "M") + x(p.km).toFixed(1) + "," + y(p.ele).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" class="svg-full">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.05"/>
    </linearGradient></defs>
    <line x1="0" y1="${h - pad}" x2="${w}" y2="${h - pad}" stroke="#1e293b"/>
    <path d="${d} L${x(maxKm).toFixed(1)},${h - pad} L${pad},${h - pad} Z" fill="url(#pg)"/>
    <path d="${d}" fill="none" stroke="#fb923c" stroke-width="2"/>
  </svg>`;
}
function simSvg(eleNorm, slope, km) {
  const horizon = 98 - slope * 1.5, hillH = 30 + eleNorm * 48;
  const dash = (km * 12) % 32, cloudX = ((km * 2.2) % 400) - 40;
  let trees = "";
  for (const s of [-1, 1]) for (let k = 0; k < 3; k++) {
    const t = (((km * 5 + k / 3 + (s === -1 ? 0 : 0.17)) % 1) + 1) % 1;
    const y = horizon + t * (180 - horizon) * 0.9 + 6;
    const x = 160 + s * (18 + Math.pow(t, 1.6) * 150);
    const sc = 0.18 + Math.pow(t, 1.3) * 1.1;
    trees += `<polygon points="${x.toFixed(1)},${(y - 36 * sc).toFixed(1)} ${(x - 9 * sc).toFixed(1)},${y.toFixed(1)} ${(x + 9 * sc).toFixed(1)},${y.toFixed(1)}" fill="#052e16"/>`;
  }
  return `<svg viewBox="0 0 320 180" class="svg-full">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/><stop offset="55%" stop-color="#0284c7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.45"/>
    </linearGradient></defs>
    <rect width="320" height="180" rx="10" fill="url(#sky)"/>
    <ellipse cx="${cloudX.toFixed(0)}" cy="34" rx="26" ry="9" fill="#e2e8f0" opacity="0.8"/>

let bike = { device: null, connected: false, name: "", svc: "", speedKmh: 0, cadence: 0, power: 0,
  lastRevs: null, lastT: null, lastCrank: null, lastCt: null, mode: "",
  cpc: null, lastGrade: null, erg: true, gradeAcc: 0 };
let circ = 2.1;
try { circ = parseFloat(localStorage.getItem("r2z_circ")) || 2.1; } catch (e) {}
try { bike.erg = localStorage.getItem("r2z_erg") !== "0"; } catch (e) {}
function saveErg() { try { localStorage.setItem("r2z_erg", bike.erg ? "1" : "0"); } catch (e) {} }
function bleStatusHtml() {
  if (bike.connected) return `<span class="ok">✓ Verbunden: ${bike.name} (${bike.svc})</span> – dein Tritt steuert Tempo &amp; Position.`;
  if (!navigator.bluetooth) return '<span class="bad">✗ Web Bluetooth fehlt in diesem Browser. iPhone: App "Bluefy" nutzen (App Store, gratis) und die Tour dort öffnen. Desktop/Android: Chrome oder Edge.</span>';
  return '<span class="dim">Nicht verbunden – Wiedergabe läuft über den Zeitregler.</span>';
}
function setBleStatus(html) { const el = $("ble-status"); if (el) el.innerHTML = html; }
function saveCirc() { try { localStorage.setItem("r2z_circ", String(circ)); } catch (e) {} }
async function connectBike() {
  if (bike.connected) { await disconnectBike(); return; }
  if (!navigator.bluetooth) { setBleStatus(bleStatusHtml()); return; }
  setBleStatus("Suche Trainer – wähle dein Smart Bike im Dialog…");
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [
        { services: ["fitness_machine"] },
        { services: ["cycling_speed_and_cadence"] },
        { services: ["cycling_power"] },
        { services: ["running_speed_and_cadence"] },
      ],
    });
    bike.device = device;
    bike.name = device.name || "Trainer";
    device.addEventListener("gattserverdisconnected", () => {
      bike.connected = false; bike.speedKmh = 0; bike.cadence = 0; bike.power = 0;
      bike.cpc = null; bike.lastGrade = null; bike.gradeAcc = 0;
      setBleStatus('<span class="bad">✗ Verbindung zum Bike getrennt.</span>');
      const eo = $("erg-out"); if (eo) eo.textContent = ergStatusHtml();
      const b = $("btn-ble"); if (b) { b.textContent = "Mit Bluetooth verbinden"; b.classList.remove("bad"); }
      const ht = $("hud-t"); if (ht) ht.textContent = relive.speed + "x";
    });
    const server = await device.gatt.connect();
    let got = "";
    if (mode === "run") {
      try {
        const svc = await server.getPrimaryService("running_speed_and_cadence");
        const ch = await svc.getCharacteristic("rsc_measurement");
        await ch.startNotifications();
        ch.addEventListener("characteristicvaluechanged", handleRsc);
        got = "RSC";
      } catch (e) {}
    }
    if (!got) try {
      const svc = await server.getPrimaryService("fitness_machine");
      const ch = await svc.getCharacteristic("indoor_bike_data");
      await ch.startNotifications();
      ch.addEventListener("characteristicvaluechanged", handleIbd);
      got = "FTMS";
      try {
        const cp = await svc.getCharacteristic("fitness_machine_control_point");
        await cp.writeValue(new Uint8Array([0x00])); // Request Control
        bike.cpc = cp;
      } catch (e) { bike.cpc = null; }
    } catch (e) {}
    if (!got) {
      try {
        const svc = await server.getPrimaryService("cycling_speed_and_cadence");
        const ch = await svc.getCharacteristic("csc_measurement");
        await ch.startNotifications();
        ch.addEventListener("characteristicvaluechanged", handleCsc);
        got = "CSC";
      } catch (e) {}
    }
    if (!got) {
      try {
        const svc = await server.getPrimaryService("cycling_power");
        const ch = await svc.getCharacteristic("cycling_power_measurement");
        await ch.startNotifications();
        ch.addEventListener("characteristicvaluechanged", handleCpm);
        got = "Nur Leistung – kein Tempo!";
      } catch (e) {}
    }
    if (!got) {
      setBleStatus('<span class="bad">✗ Verbunden, aber kein passender Sensor-Dienst (FTMS/CSC/Power) gefunden.</span>');
      try { await device.gatt.disconnect(); } catch (e) {}
      return;
    }
    bike.connected = true;
    bike.svc = got === "Nur Leistung – kein Tempo!" ? "Power" : got;
    bike.mode = got === "Nur Leistung – kein Tempo!" ? "power" : "speed";
    if (bike.mode === "power") setBleStatus('<span class="amber">⚠ Nur Leistungsmessung gefunden – Tempo-Sync braucht FTMS oder CSC.</span>');
    else setBleStatus(bleStatusHtml());
    const b = $("btn-ble"); if (b) b.textContent = "Trennen";
  } catch (e) {
    setBleStatus('<span class="bad">✗ Abgebrochen: ' + String((e && e.message) || e) + '</span>');
  }
}
async function disconnectBike() {
  try { if (bike.cpc) await bike.cpc.writeValue(new Uint8Array([0x04, 0, 0, 0, 0, 0x28, 0x33])); } catch (e) {}
  try { if (bike.device && bike.device.gatt && bike.device.gatt.connected) await bike.device.gatt.disconnect(); } catch (e) {}
  bike.connected = false; bike.speedKmh = 0; bike.cadence = 0; bike.power = 0;
  bike.lastRevs = null; bike.lastCrank = null;
  bike.cpc = null; bike.lastGrade = null; bike.gradeAcc = 0;
  setBleStatus(bleStatusHtml());
  const eo = $("erg-out"); if (eo) eo.textContent = ergStatusHtml();
  const b = $("btn-ble"); if (b) b.textContent = "Mit Bluetooth verbinden";
  const ht = $("hud-t"); if (ht) ht.textContent = relive.speed + "x";
}
function handleIbd(ev) {
  const dv = ev.target.value;
  const flags = dv.getUint16(0, true);
  let off = 2;
  if (flags & 0x0001) { bike.speedKmh = dv.getUint16(off, true) * 0.01; off += 2; }
  if (flags & 0x0002) { off += 2; }
  if (flags & 0x0004) { bike.cadence = dv.getUint16(off, true) * 0.5; off += 2; }
  if (flags & 0x0008) { off += 2; }
  if (flags & 0x0010) { off += 3; }
  if (flags & 0x0020) { off += 2; }
  if (flags & 0x0040) { bike.power = dv.getInt16(off, true); off += 2; }
}
function handleCsc(ev) {
  const dv = ev.target.value;
  const flags = dv.getUint8(0);
  let off = 1;
  if (flags & 0x01) {
    const revs = dv.getUint32(off, true); off += 4;
    const t = dv.getUint16(off, true); off += 2;
    if (bike.lastRevs !== null && revs >= bike.lastRevs) {
      const dRevs = revs - bike.lastRevs;
      const dt = (t - bike.lastT + 65536) % 65536;
      if (dt > 0 && dRevs > 0) bike.speedKmh = (dRevs * circ * 3.6 * 1024) / dt;
    }
    bike.lastRevs = revs; bike.lastT = t;
  }
  if (flags & 0x02) {
    const crank = dv.getUint16(off, true);
    const ct = dv.getUint16(off + 2, true);
    if (bike.lastCrank !== null && crank >= bike.lastCrank) {
      const dc = crank - bike.lastCrank;
      const dct = (ct - bike.lastCt + 65536) % 65536;
      if (dc > 0 && dct > 0) bike.cadence = (dc * 60 * 1024) / (dct * 2);
    }
    bike.lastCrank = crank; bike.lastCt = ct;
  }
}
function handleRsc(ev) {
  const dv = ev.target.value;
  bike.speedKmh = (dv.getUint16(1, true) / 256) * 3.6; // RSC: m/s mit 1/256-Auflösung
  bike.cadence = dv.getUint16(3, true);                // Schritte/min
}
function handleCpm(ev) {
  const dv = ev.target.value;
  const flags = dv.getUint16(0, true);
  let off = 2;
  if (flags & 0x0001) off += 1;
  if (flags & 0x0002) off += 2;
  bike.power = dv.getInt16(off, true);
}
function ergStatusHtml() {
  if (!bike.connected) return "Verbinde zuerst dein Bike.";
  if (!bike.cpc) return "Trainer ohne FTMS-Steuerung – Widerstands-Sync nicht verfügbar.";
  return bike.erg ? "Aktiv: Der Trainer folgt der Steigung deiner Tour." : "Aus – der Trainer bleibt in seinem eigenen Modus.";
}
async function sendGrade(pct) {
  if (!bike.cpc) return;
  const g = Math.max(-30, Math.min(30, pct));
  const v = Math.round(g * 100);
  const data = new Uint8Array(7);
  data[0] = 0x04;                       // Set Indoor Bike Simulation Parameters
  data[1] = 0; data[2] = 0;             // Windgeschwindigkeit 0 m/s
  data[3] = v & 0xff; data[4] = (v >> 8) & 0xff; // Steigung in 0.01 %
  data[5] = 0x28;                       // Rollwiderstand CRR 0.004
  data[6] = 0x33;                       // Luftwiderstand CW 0.51 kg/m
  try {
    await bike.cpc.writeValue(data);
    bike.lastGrade = g;
    const eo = $("erg-out"); if (eo) eo.textContent = "Steigung gesendet: " + (g >= 0 ? "+" : "") + g.toFixed(1) + " %";
  } catch (e) {
    const eo = $("erg-out"); if (eo) eo.textContent = "Widerstand senden fehlgeschlagen.";
  }
}

function streetViewUrl(pt, bearing) {
  return "https://maps.googleapis.com/maps/api/streetview?size=640x360&location=" +
    pt.lat.toFixed(6) + "," + pt.lon.toFixed(6) +
    "&heading=" + Math.round(bearing) + "&fov=90&pitch=-4&source=outdoor&key=" + encodeURIComponent(settings.svKey);
}
function loadImg(url) {
  return new Promise((res) => {
    const i = new Image();
    i.onload = () => res(true);
    i.onerror = () => res(false);
    i.src = url;
  });
}
async function fetchMapillaryUrl(lat, lon, bearing) {
  try {
    const dLat = 0.0012, dLon = 0.0016;
    const bbox = [(lon - dLon).toFixed(6), (lat - dLat).toFixed(6), (lon + dLon).toFixed(6), (lat + dLat).toFixed(6)].join(",");
    const r = await fetch("https://graph.mapillary.com/images?access_token=" + encodeURIComponent(settings.mlyToken) +
      "&bbox=" + bbox + "&is_compass=true&fields=id,computed_geometry,compass_angle,thumb_1024_url");
    if (!r.ok) return null;
    const j = await r.json();
    const data = (j && j.data) || [];
    let best = null, bestScore = Infinity;
    for (const im of data) {
      const c = im.computed_geometry && im.computed_geometry.coordinates;
      if (!c || !im.thumb_1024_url) continue;
      const d = haversineKm({ lat, lon }, { lat: c[1], lon: c[0] });
      if (d > 0.15) continue;
      const hd = im.compass_angle == null ? 0 : Math.abs(((im.compass_angle - bearing + 540) % 360) - 180);
      const score = d * 1000 + hd * 3 + (hd > 90 ? 1000 : 0);
      if (score < bestScore) { bestScore = score; best = im; }
    }
    return best ? best.thumb_1024_url : null;
  } catch (e) { return null; }
}
async function fetchPanoramaxUrl(lat, lon, bearing) {
  try {
    const dLat = 0.0012, dLon = 0.0016;
    const bbox = [(lon - dLon).toFixed(6), (lat - dLat).toFixed(6), (lon + dLon).toFixed(6), (lat + dLat).toFixed(6)].join(",");
    const r = await fetch("https://api.panoramax.xyz/api/search?bbox=" + bbox + "&limit=30");
    if (!r.ok) return null;
    const j = await r.json();
    const features = (j && j.features) || [];
    let bestUrl = null, bestScore = Infinity;
    for (const f of features) {
      const c = f.geometry && f.geometry.coordinates;
      const hrefs = f.assets && f.assets.hero && f.assets.hero.href;
      const url = hrefs && (hrefs.sd || hrefs.hd || hrefs.th);
      if (!c || !url) continue;
      const d = haversineKm({ lat, lon }, { lat: c[1], lon: c[0] });
      if (d > 0.15) continue;
      const ph = f.properties && f.properties.heading;
      const hd = ph == null ? 0 : Math.abs(((ph - bearing + 540) % 360) - 180);
      const score = d * 1000 + hd * 3 + (hd > 90 ? 1000 : 0);
      if (score < bestScore) { bestScore = score; bestUrl = url; }
    }
    return bestUrl;
  } catch (e) { return null; }
}
const imgHtml = (url, credit) => `<div class="imgwrap"><img src="${url}" alt="Panoramabild der aktuellen Position"><span class="attr">${credit}</span></div>`;
const loadingBox = (txt) => `<div class="loadbox">${txt}</div>`;

function stopForIdx(idx) {
  const s = ride.stops;
  let lo = 0, hi = s.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (s[mid] <= idx) lo = mid; else hi = mid - 1;
  }
  return lo;
}
async function resolveStop(stopIdx) {
  imgCache[stopIdx] = "pending";
  const pi = ride.points[ride.stops[stopIdx]];
  const bearing = bearingOf(pi, ride.points[Math.min(ride.points.length - 1, ride.stops[stopIdx] + 3)]);
  let result = null;
  if (settings.svKey) {
    const url = streetViewUrl(pi, bearing);
    if (await loadImg(url)) result = { url, credit: "© Google" };
  }
  if (!result && settings.mlyToken) {
    const u = await fetchMapillaryUrl(pi.lat, pi.lon, bearing);
    if (u) result = { url: u, credit: "© Mapillary" };
  }
  if (!result) {
    const p = await fetchPanoramaxUrl(pi.lat, pi.lon, bearing);
    if (p) result = { url: p, credit: "© Panoramax" };
  }
  imgCache[stopIdx] = result;
}
function preloadFrom(stopIdx) {
  const end = Math.min(ride.stops.length, stopIdx + 12);
  for (let i = stopIdx; i < end; i++) {
    if (imgCache[i] === undefined) resolveStop(i);
  }
}
function setFp(stopIdx) {
  const fp = $("fp");

  const cached = imgCache[stopIdx];
  if (cached && cached !== "pending") {
    relive.lastGood = cached;
    fp.innerHTML = imgHtml(cached.url, cached.credit);
    return;
  }
  if (relive.lastGood) {
    fp.innerHTML = imgHtml(relive.lastGood.url, relive.lastGood.credit);
    return;
  }
  const m = reliveMetrics();
  if (cached === null) {
    fp.innerHTML = simSvg(m.eleNorm, m.slope, m.km) +
      '<p class="amber fp-note">Simulation – keine Panoramen an dieser Position</p>';
    return;
  }
  fp.innerHTML = loadingBox("Lade Panoramabild…");
}

// ---------- Live-Aufnahme (GPS) ----------
let rec = { on: false, pts: [], t0: 0, watch: null };
function recs() { try { return JSON.parse(localStorage.getItem("r2z_recs") || "[]"); } catch (e) { return []; } }
function saveRecs(list) { try { localStorage.setItem("r2z_recs", JSON.stringify(list)); } catch (e) {} }
function recStats() {
  let dist = 0;
  for (let i = 1; i < rec.pts.length; i++) dist += haversineKm(rec.pts[i - 1], rec.pts[i]);
  const dur = rec.pts.length ? Math.round(((rec.pts[rec.pts.length - 1].t || Date.now()) - (rec.pts[0].t || rec.t0)) / 1000) : 0;
  return { distKm: dist, dur, n: rec.pts.length };
}
function startRec() {
  if (!navigator.geolocation) { alert("GPS wird von diesem Browser nicht unterstützt."); return; }
  rec = { on: true, pts: [], t0: Date.now(), watch: null };
  rec.watch = navigator.geolocation.watchPosition((pos) => {
    const c = pos.coords;
    const last = rec.pts[rec.pts.length - 1];
    if (last && haversineKm(last, { lat: c.latitude, lon: c.longitude }) * 1000 < 4) return;
    rec.pts.push({ lat: c.latitude, lon: c.longitude, ele: c.altitude || 0, t: Date.now() });
    const s = recStats();
    const el = $("rec-live");
    if (el) el.textContent = `● Aufnahme läuft: ${fmt(s.distKm)} km · ${Math.floor(s.dur / 60)}:${String(s.dur % 60).padStart(2, "0")} min · ${s.n} Punkte`;
  }, (err) => { alert("GPS-Fehler: " + (err && err.message ? err.message : "unbekannt")); stopRec(); },
  { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 });
  renderImport();
}
function stopRec() {
  if (rec.watch !== null) { try { navigator.geolocation.clearWatch(rec.watch); } catch (e) {} }
  rec.on = false; rec.watch = null;
  if (rec.pts.length < 10) { alert("Zu kurz aufgezeichnet – mindestens 10 GPS-Punkte nötig."); renderImport(); return; }
  const dur = Math.max(60, Math.round(((rec.pts[rec.pts.length - 1].t || Date.now()) - rec.pts[0].t) / 1000));
  const name = (mode === "run" ? "Lauf " : "Fahrt ") + new Date().toLocaleDateString("de-DE");
  const r = buildRide(name, rec.pts, "Live-Aufnahme");
  if (!r) { alert("Aufnahme konnte nicht ausgewertet werden."); renderImport(); return; }
  r.realSec = dur;
  const list = recs();
  list.unshift({ id: Date.now(), name: r.name, date: new Date().toISOString(), distanceKm: r.distanceKm,
    elevationM: r.elevationM, realSec: dur, pts: rec.pts.filter((_, i) => i % 2 === 0) });
  if (list.length > 10) list.length = 10;
  saveRecs(list);
  loadRide(r);
}
function recListHtml() {
  const list = recs();
  if (!list.length) return '<p class="hint" style="margin-top:10px">Noch keine Aufnahmen gespeichert – die letzten 10 werden automatisch hier abgelegt.</p>';
  return `<div class="divider"><label class="lbl">Gespeicherte Aufnahmen</label>` + list.map((x) => `
    <div class="row-flex" style="margin-top:8px">
      <button class="demo-btn" data-rec="${x.id}" style="flex:1;margin-bottom:0">${x.name}
        <span class="go">Laden →</span><span class="meta">${fmt(x.distanceKm)} km · ${x.elevationM} hm</span></button>
      <button class="btn-sec" data-recdel="${x.id}">🗑</button>
    </div>`).join("") + `</div>`;
}
function loadRec(id) {
  const x = recs().find((y) => String(y.id) === String(id));
  if (!x) return;
  const r = buildRide(x.name, x.pts, "Live-Aufnahme");
  if (r) { r.realSec = x.realSec || r.realSec; loadRide(r); }
}
function delRec(id) { saveRecs(recs().filter((y) => String(y.id) !== String(id))); renderImport(); }

// ---------- Teilen ----------
function gpxFromRide() {
  const pts = ride.points.map((p) => `<trkpt lat="${p.lat}" lon="${p.lon}"><ele>${Math.round(p.ele)}</ele></trkpt>`).join("");
  return '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="ReRide" xmlns="http://www.topografix.com/GPX/1/1">' +
    `<trk><name>${String(ride.name).replace(/</g, "")}</name><trkseg>${pts}</trkseg></trk></gpx>`;
}
function rideFileName() {
  return (ride.name || "reride").replace(/[^\w\- äöüÄÖÜß]+/g, "").trim().replace(/\s+/g, "_") + ".gpx";
}
function dlGpx() {
  if (!ride) { alert("Bitte zuerst eine Fahrt laden."); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([gpxFromRide()], { type: "application/gpx+xml" }));
  a.download = rideFileName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function shareRide() {
  if (!ride) { alert("Bitte zuerst eine Fahrt laden."); return; }
  const text = `Meine ${mode === "run" ? "Lauf" : "Tour"} „${ride.name}" mit ReRide: ` +
    `${fmt(ride.distanceKm)} km · ${ride.elevationM} hm – bald im Panorama-Modus nachfahren!`;
  try {
    const file = new File([gpxFromRide()], rideFileName(), { type: "application/gpx+xml" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], text, title: "ReRide" });
      return;
    }
    if (navigator.share) { await navigator.share({ text, title: "ReRide" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  dlGpx();
  alert("Teilen nicht verfügbar – die GPX-Datei wurde stattdessen heruntergeladen.");
}
async function shareApp() {
  const text = "ReRide: Eigene Radrunden und Läufe als Panorama-Fahrt nachfahren. " + location.href;
  try { if (navigator.share) { await navigator.share({ text, title: "ReRide" }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(text); alert("Link kopiert!"); } catch (e) {}
}

try { wakeOn = localStorage.getItem("r2z_wake") === "1"; } catch (e) {}
async function applyWake() {
  if (wakeOn && "wakeLock" in navigator) { try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {} }
  else if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (wakeOn && document.visibilityState === "visible") applyWake(); });

// ---------- Tabs & Rendering ----------
document.querySelectorAll("nav button").forEach((b) => {
  b.addEventListener("click", () => setTab(b.dataset.tab));
});
function setTab(id) {
  tab = id;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === id));
  ["import", "analyse", "match", "relive", "setup"].forEach((t) => { $("tab-" + t).hidden = t !== id; });
  render();
}
function needRide(tabName) {
  if (ride) return null;
  return `<div class="card" style="text-align:center;padding:36px 16px">
    <div style="font-size:34px;margin-bottom:8px">🗺️</div>
    <p class="hint">Bitte zuerst eine Fahrt im Import-Tab laden, um ${tabName} zu sehen.</p>
  </div>`;
}
function render() {
  if (tab === "import") renderImport();
  if (tab === "analyse") renderAnalyse();
  if (tab === "match") renderMatch();
  if (tab === "relive") renderRelive();
  if (tab === "setup") renderSetup();
}

function loadRide(r) {
  if (!r) { alert("Datei nicht erkannt. Unterstützt: GPX und TCX mit GPS-Punkten. FIT-Dateien bitte in Garmin Connect als GPX exportieren, ZIP entpacken."); return; }
  ride = r;
  relive = { playing: false, progress: 0, speed: relive.speed, timer: null, lastStop: -1, lastFrame: null, lastGood: null, seq: 0 };
  imgCache = {};
  setTab("analyse");
}

// ---------- Relive ----------
function reliveMetrics() {
  const n = ride.points.length;
  const idx = clamp(Math.round(relive.progress * (n - 1)), 0, n - 1);
  const pt = ride.points[idx];
  const prev = ride.points[Math.max(0, idx - 2)], next = ride.points[Math.min(n - 1, idx + 2)];
  const segKm = haversineKm(prev, next) || 0.01;
  const slope = clamp(((next.ele - prev.ele) / (segKm * 1000)) * 100, -25, 25);
  const eles = ride.points.map((p) => p.ele);
  const minE = Math.min(...eles), maxE = Math.max(...eles);
  const eleNorm = (pt.ele - minE) / (maxE - minE || 1);
  return { idx, pt, slope, eleNorm, km: relive.progress * ride.distanceKm };
}
function toggleFs() {

  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!isFs && req) {
    try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {}
  } else if (isFs) {
    const ex = doc.exitFullscreen || doc.webkitExitFullscreen;
    if (ex) { try { const p = ex.call(doc); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  } else {
    alert("Vollbild wird von diesem Browser nicht unterstützt.\n\nFür Apple TV: Kontrollzentrum öffnen → „Bildschirmübertragung“ → Apple TV, dann Handy quer drehen.");
  }
}

function updateReliveFrame(fullMap) {
  if (!ride) return;
  const m = reliveMetrics();
  const hk = $("hud-km"), hh = $("hud-h"), hs = $("hud-s"), ht = $("hud-t");
  if (hk) hk.textContent = fmt(m.km);
  if (hh) hh.textContent = Math.round(m.pt.ele) + " m";
  if (hs) hs.textContent = fmt(m.slope) + " %";
  if (bike.connected) {
    if (ht) ht.textContent = bike.speedKmh.toFixed(1) + " km/h";
    const hc = $("hud-c"); if (hc) hc.textContent = bike.cadence > 0 ? Math.round(bike.cadence) + " rpm" : "–";
    const hp = $("hud-p"); if (hp) hp.textContent = bike.power > 0 ? Math.round(bike.power) + " W" : "–";
  } else if (ht) ht.textContent = relive.speed + "x";
  const rm = $("rmap");
  if (rm && (fullMap || Math.random() < 0.5)) rm.innerHTML = routeMapSvg(ride.points, relive.progress);
  const stopIdx = stopForIdx(m.idx);
  if (stopIdx !== relive.lastStop) {
    relive.lastStop = stopIdx;
    relive.lastFrame = null;
    preloadFrom(stopIdx);
  }
  const cached = imgCache[stopIdx];
  const frameKey = cached && cached !== "pending" ? cached.url : relive.lastGood ? "keep" : cached === null ? "sim" : "pending";
  if (frameKey !== relive.lastFrame || frameKey === "sim") {
    relive.lastFrame = frameKey;
    setFp(stopIdx);
  }
}
setInterval(() => {
  if (!ride) return;
  if (bike.connected && bike.cpc && bike.erg) {
    bike.gradeAcc += 0.05;
    const target = relive.playing ? reliveMetrics().slope : 0;
    if (bike.gradeAcc >= 1 && Math.abs(target - (bike.lastGrade || 0)) > 0.4) {
      bike.gradeAcc = 0;
      sendGrade(target);
    }
  }
  if (!relive.playing) return;
  if (bike.connected && bike.mode === "speed") {
    const mps = bike.speedKmh / 3.6;
    if (mps > 0.3) relive.progress = Math.min(1, relive.progress + (mps * 0.05) / (ride.distanceKm * 1000));
  } else {
    relive.progress = Math.min(1, relive.progress + (relive.speed * 0.05) / ride.realSec);
  }
  if (relive.progress >= 1) relive.playing = false;
  updateReliveFrame(true);
  const seek = $("seek"); if (seek) seek.value = relive.progress;
  const btn = $("btn-play"); if (btn && !relive.playing) btn.textContent = relive.progress >= 1 ? "↻" : "▶";
}, 50);

// ---------- Verbindungstest ----------
async function runConnTest() {
  const out = $("conn-out");
  if (!out) return;
  if (!ride) { out.innerHTML = '<span class="amber">Bitte zuerst eine Fahrt laden.</span>'; return; }
  out.innerHTML = "Test läuft…";
  const res = {};
  const p0 = ride.points[0];
  const dLat = 0.0012, dLon = 0.0016;
  const bbox = [(p0.lon - dLon).toFixed(6), (p0.lat - dLat).toFixed(6), (p0.lon + dLon).toFixed(6), (p0.lat + dLat).toFixed(6)].join(",");
  if (settings.mlyToken) {
    try {
      const r = await fetch("https://graph.mapillary.com/images?access_token=" + encodeURIComponent(settings.mlyToken) +
        "&bbox=" + bbox + "&is_compass=true&fields=id");
      if (r.ok) {
        const j = await r.json();
        const n = ((j && j.data) || []).length;
        res.mlyApi = '<span class="ok">✓ erreichbar</span>';
        res.mlyStart = n > 0 ? `<span class="ok">✓ ${n} Fotos am Startpunkt</span>` : '<span class="bad">✗ keine Fotos am Startpunkt</span>';
      } else {
        res.mlyApi = r.status === 401 ? '<span class="bad">✗ Token ungültig (HTTP 401)</span>' : `<span class="bad">✗ HTTP-Fehler ${r.status}</span>`;
        res.mlyStart = '<span class="dim">–</span>';
      }
    } catch (e) { res.mlyApi = '<span class="bad">✗ Netzwerk blockiert</span>'; res.mlyStart = '<span class="dim">–</span>'; }
  } else { res.mlyApi = '<span class="dim">– kein Token gesetzt</span>'; res.mlyStart = '<span class="dim">–</span>'; }
  try {
    const r = await fetch("https://api.panoramax.xyz/api/search?bbox=" + bbox + "&limit=30");
    if (r.ok) {
      const j = await r.json();
      const n = ((j && j.features) || []).length;
      res.panoApi = '<span class="ok">✓ erreichbar (ohne Token)</span>';
      res.panoStart = n > 0 ? `<span class="ok">✓ ${n} Fotos am Startpunkt</span>` : '<span class="bad">✗ keine Fotos am Startpunkt</span>';
    } else {
      res.panoApi = `<span class="bad">✗ HTTP-Fehler ${r.status}</span>`;
      res.panoStart = '<span class="dim">–</span>';
    }
  } catch (e) { res.panoApi = '<span class="bad">✗ Netzwerk blockiert</span>'; res.panoStart = '<span class="dim">–</span>'; }
  out.innerHTML = `<b>Diagnose (Startpunkt deiner Fahrt)</b><br>
    Mapillary-API: ${res.mlyApi}<br>Mapillary-Fotos: ${res.mlyStart}<br>
    Panoramax-API: ${res.panoApi}<br>Panoramax-Fotos: ${res.panoStart}`;
}

// ---------- Setup-Tab ----------
function renderSetup() {
  $("tab-setup").innerHTML = `
    <div class="card">
      <h2>Modus: Bike oder Run</h2>
      <div class="row-flex">
        <button class="btn-sec" id="mode-bike" style="flex:1;padding:11px;${mode !== "run" ? "background:#f97316;color:#020617" : ""}">🚴 ReRide Bike</button>
        <button class="btn-sec" id="mode-run" style="flex:1;padding:11px;${mode === "run" ? "background:#f97316;color:#020617" : ""}">🏃 ReRide Run</button>
      </div>
      <p class="hint" style="margin-top:10px"><b>ReRide Run</b> nutzt dasselbe Prinzip fürs Laufen: eigene Läufe als
        Panorama-Strecke nachlaufen, GPS-Aufnahme funktioniert genauso, und statt des Smart Trainers verbinden sich
        Lauf-Sensoren (Running Speed &amp; Cadence – z. B. Footpods oder Laufband) mit dem Tempo-Sync.</p>
    </div>
    <div class="card">
      <h2>Display</h2>
      <label class="lbl">Dimmung des Bildschirms (schont beim Fahren im Dunkeln)</label>
      <input type="range" id="dim-slider" min="0" max="80" value="${dimVal}" style="width:100%;accent-color:#f97316;margin-top:8px">
      <button class="btn-sec" id="btn-wake" style="width:100%;margin-top:12px;padding:11px">${wakeOn ? "✓" : ""} Bildschirm wachhalten ${wakeOn ? "an" : "aus"}</button>
      <p class="hint" style="margin-top:8px">„Wachhalten" verhindert, dass das Display während der Fahrt ausgeht (soweit der Browser es unterstützt).</p>
    </div>
    <div class="card">
      <h2>Teilen</h2>
      <button class="btn-primary" id="btn-share-ride">${mode === "run" ? "🏃" : "🚴"} Aktuelle Strecke teilen (inkl. GPX)</button>
      <button class="btn-sec" id="btn-share-app" style="width:100%;margin-top:8px;padding:11px">📲 ReRide weiterempfehlen</button>
      <button class="btn-sec" id="btn-dl-gpx" style="width:100%;margin-top:8px;padding:11px">💾 GPX-Datei herunterladen</button>
      <p class="hint" style="margin-top:8px">Teilt Zusammenfassung + GPX über das Teilen-Menü (Nachrichten, Mail, WhatsApp…) – ideal für Garmin/Strava-Import auf der Gegenseite.</p>
    </div>
    <div class="info-box"><b>Über ReRide</b> – v1.7: Eigene Radrunden und Läufe aufzeichnen oder importieren und als
      Panorama-Fahrt nachfahren – mit Smart-Bike-Sync für Tempo und Widerstand. Wiedergabe-Tempo: 1x, 2x, 4x, 10x, 20x.
      Alle Daten bleiben auf deinem Gerät.</div>`;
  $("mode-bike").addEventListener("click", () => setMode("bike"));
  $("mode-run").addEventListener("click", () => setMode("run"));
  $("dim-slider").addEventListener("input", (e) => {
    dimVal = clamp(parseInt(e.target.value) || 0, 0, 80);
    try { localStorage.setItem("r2z_dim", String(dimVal)); } catch (e2) {}
    applyDim();
  });
  $("btn-wake").addEventListener("click", async () => {
    wakeOn = !wakeOn;
    try { localStorage.setItem("r2z_wake", wakeOn ? "1" : "0"); } catch (e) {}
    await applyWake();
    renderSetup();
  });
  $("btn-share-ride").addEventListener("click", shareRide);
  $("btn-share-app").addEventListener("click", shareApp);
  $("btn-dl-gpx").addEventListener("click", dlGpx);
}
function setMode(m) {
  if (mode === m) return;
  mode = m;
  applyMode();
  if (ride) ride.realSec = realSecFor(ride.distanceKm);
  renderSetup();
}

// ---------- Start ----------
applyMode();
applyDim();
applyWake();
render();
</script>
</body>
</html>
